name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # #264 review: the default (depth 1, no tags) can't see a tag, so version.py would rely on GITHUB_REF alone.
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fixtures match gen_fixtures.py (#100)
        run: |
          python3 test-fixtures/gen_fixtures.py
          git diff --exit-code test-fixtures/
          diff -r test-fixtures/configs app/src/test/resources/configs
      - name: validate.py agrees with the phone
        run: pip install jsonschema && python3 scripts/test_validate.py
      - name: Grep gate — no stray old applicationId (#242 F)
        run: python3 scripts/check_package_literals.py && python3 scripts/test_check_package_literals.py
      - name: Version rule (#255)
        run: python3 scripts/test_version.py
      - name: Release signing checks (#254)
        run: python3 scripts/test_release_check.py
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Debug APK is signed with the committed debug key (#73)
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | tee signer.txt
          grep -qi "SHA-256 digest: 3a0cb6b59a1140b4b76d6a6fd70fbf3744f3174fd2479d89a3a148810cfd3dca" signer.txt
      - name: Release APK without the release secrets is unsigned, never debug-signed (#254)
        run: |
          ls app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$SIGNER" verify app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo "::error::the release APK has a signature without the release secrets"; exit 1
          fi
      - name: APK versionName matches the version rule (#255)
        env:
          # #264 review: on a tag, compare with the tag itself, so an APK stamped as untagged can't pass.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if [ -n "$TAG" ]; then
              python3 scripts/version.py --check-apk "$apk" --expect-tag "$TAG"
            else
              python3 scripts/version.py --check-apk "$apk"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: reflow-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
