name: Release
# #254: the signed release APK for a v* tag. Runs in the protected `release` environment (deployments only from v*
# tags, Christopher as required reviewer), so a PR or branch run can never read the key and every signing run waits
# for his approval. It fails clearly if a secret or the pinned fingerprint is missing; it never falls back to the
# debug key. The APK is attached to the tag's GitHub Release, which Christopher or Grok Bot create (ARCHITECTURE
# §18.1); agents don't tag. Setup and the verify command: README "Release builds: signing key".
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write  # gh release upload
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # #264 review: the default checkout (depth 1, no tags) can't see the tag; version.py would then rely on
          # GITHUB_REF alone. The APK is also compared with the tag directly below.
          fetch-depth: 0
          fetch-tags: true
      - name: The tag is a version tag (#255)
        run: python3 scripts/version.py --tag "$TAG"
      - name: Release checks and version rule tests
        run: python3 scripts/test_release_check.py && python3 scripts/test_version.py
      - name: All 4 release secrets are set
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 scripts/release_check.py secrets
      - name: release-cert.sha256 holds the release fingerprint
        run: python3 scripts/release_check.py pin
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          # A signing build neither reads nor writes the shared Gradle cache.
          cache-disabled: true
      - name: Decode the keystore to the runner's temp dir
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          umask 077
          # #268: keep xtrace off so a debug trace can't print the keystore bytes.
          set +x
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reflow-release.p12"
          test -s "$RUNNER_TEMP/reflow-release.p12" || { echo "::error::RELEASE_KEYSTORE_B64 did not decode to a keystore"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/reflow-release.p12" >> "$GITHUB_ENV"
      - name: Assemble the signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/reflow-release.p12"
      - name: Signed with the pinned release key (v2 + v3), not the debug key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed app-release.apk; the release signingConfig was not applied."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # minSdk is 29, where apksigner checks only v3 by default; --min-sdk-version 24 makes it check v2 as well.
          "$SIGNER" verify -v --print-certs --min-sdk-version 24 "$APK" | tee signer.txt
          python3 scripts/release_check.py verify signer.txt
      - name: versionName and versionCode match the tag (#255, #264 review)
        run: python3 scripts/version.py --check-apk app/build/outputs/apk/release/app-release.apk --expect-tag "$TAG"
      - name: Name the APK and its checksum
        run: |
          NAME=$(python3 scripts/version.py --tag "$TAG" | sed -n 's/^VERSION_NAME=//p')
          APK_FILE="reflow-launcher-$NAME.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          (cd dist && sha256sum "$APK_FILE" > "$APK_FILE.sha256")
          FP=$(python3 scripts/release_check.py pin | sed 's/.*: //')
          {
            echo "### $APK_FILE"
            echo
            echo "Signing certificate SHA-256 (put this in the release notes): \`$FP\`"
            echo
            echo "APK SHA-256: \`$(cut -d' ' -f1 "dist/$APK_FILE.sha256")\`"
            echo
            echo "Check a download: \`apksigner verify --print-certs $APK_FILE | grep SHA-256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reflow-launcher-release-apk
          path: dist/
          if-no-files-found: error
      - name: Attach the APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Christopher or Grok Bot create the Release for this tag; wait up to 15 minutes for it.
          for _ in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::error::No GitHub Release for $TAG after 15 minutes. Create it, then re-run this job (the APK is also in the run's artifacts)."
          exit 1
